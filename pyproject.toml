[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crazytimer-croncadence"
version = "0.1.0"
description = "统计各任务的触发周期、实际执行时刻与相互重叠时长，标出会撞车的组合"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "crazytimer" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://crazytimer.github.io"
Repository = "https://github.com/crazytimer/croncadence"
Issues = "https://github.com/crazytimer/croncadence/issues"

[project.scripts]
croncadence = "croncadence:main"

[tool.setuptools]
py-modules = ["croncadence"]
